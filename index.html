<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Registration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <main class="card">
    <div class="card__tab">Enrollment</div>

    <header class="card__header">
      <h1>Student Registration</h1>
      <p>Fill in your details below to reserve your seat for the upcoming term.</p>
    </header>

    <form class="form" novalidate>
      <div class="field">
        <label for="name">Full name</label>
        <input type="text" id="name" name="name" placeholder="SafwanMalik" required />
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" placeholder="Safwan@email.com" required />
      </div>

      <button type="submit" class="submit">Register</button>
    </form>

    <footer class="card__footer">
      <span>Ref. no. — auto-assigned on submission</span>
    </footer>
  </main>

</body>
</html>
